<script>
'use strict';
/* Bass Ear Trainer v2 — no dependencies; GitHub Pages-compatible. */
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mod=(n,m=12)=>(n%m+m)%m, day=86400000, now=()=>Date.now(), med=a=>{if(!a.length)return null;let b=[...a].sort((x,y)=>x-y),k=Math.floor(b.length/2);return b.length%2?b[k]:(b[k-1]+b[k])/2};
const LETTERS=['C','D','E','F','G','A','B'], NAT={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, MAJOR=[0,2,4,5,7,9,11], MINOR=[0,2,3,5,7,8,10], SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const OPEN={E:40,A:45,D:50,G:55}, KEYS=['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'], MINKEYS=['A','E','B','F#','C#','G#','D#','Bb','F','C','G','D'];
const INTS=[{n:'m2',s:1,name:'minor second'},{n:'M2',s:2,name:'major second'},{n:'m3',s:3,name:'minor third'},{n:'M3',s:4,name:'major third'},{n:'P4',s:5,name:'perfect fourth'},{n:'TT',s:6,name:'tritone'},{n:'P5',s:7,name:'perfect fifth'},{n:'m6',s:8,name:'minor sixth'},{n:'M6',s:9,name:'major sixth'},{n:'m7',s:10,name:'minor seventh'},{n:'M7',s:11,name:'major seventh'},{n:'P8',s:12,name:'octave'}];
const SKILL={fret:'Fretboard',degree:'Scale degrees',interval:'Intervals',triad:'Chords',ear:'Ear & singing',rhythm:'Rhythm',notation:'Notation'};
function pc(n){let m=/^([A-G])([#b]{0,2})$/.exec(n);if(!m)return null;return mod(NAT[m[1]]+[...m[2]].reduce((a,x)=>a+(x==='#'?1:-1),0))}
function spell(root,semitones,steps){let i=LETTERS.indexOf(root[0]);let letter=LETTERS[(i+steps)%7],diff=mod(pc(root)+semitones-NAT[letter]);if(diff>6)diff-=12;return letter+(diff>0?'#'.repeat(diff):'b'.repeat(-diff))}
function scale(root,mode){return(mode==='minor'?MINOR:MAJOR).map((v,i)=>spell(root,v,i))}
function triad(root,quality){let third=quality==='minor'||quality==='dim'?3:4,fifth=quality==='dim'?6:quality==='aug'?8:7;return[root,spell(root,third,2),spell(root,fifth,4)]}
function enh(pcNum){return SH[pcNum]===FL[pcNum]?SH[pcNum]:`${SH[pcNum]} / ${FL[pcNum]}`}
function numberName(n){return n===0?'open':`fret ${n}`}
function hz(midi){return 440*2**((midi-69)/12)}
function midiAt(str,fret){return OPEN[str]+fret}
function noteAt(str,fret){return SH[mod(midiAt(str,fret))]}
function guessFret(str,n){let d=mod(pc(n)-OPEN[str]);return d}
function safetyJson(s){if(typeof s!=='string'||s.length>4e6)throw Error('Backup too large');let x=JSON.parse(s);if(!x||typeof x!=='object')throw Error('Invalid backup');return x}
const VKEY='bassTrainer.v2', OLD='bassTrainer.v1', DEF={minutes:55,bpm:75,stage:1,microphone:false,micMode:'bass',a4:440,sensitivity:.008,voiceRecognition:false,showAnswerMethods:true,shuffle:true};
function initData(){try{const obj=safetyJson(localStorage.getItem(VKEY));if(obj.version===2&&obj.config&&obj.items&&obj.cards&&Array.isArray(obj.log))return {...obj,config:{...DEF,...obj.config}}}catch(e){}return{version:2,config:{...DEF},items:{},cards:{},log:[],created:now(),legacy:null}}
let data=initData();
// Original v1 data is preserved untouched in its original localStorage key.
// A copy is carried in exports; legacy sessions remain separate because their scoring is incompatible.
if(!data.legacy){try{let raw=localStorage.getItem(OLD);if(raw){let obj=safetyJson(raw);if(obj.cfg){data.legacy={detectedAt:now(),retainedUnder:OLD};if(!localStorage.getItem(VKEY))data.config.minutes=obj.cfg.len||55;}}}catch(e){}}
function save(){data.log=data.log.slice(-6000);try{localStorage.setItem(VKEY,JSON.stringify(data))}catch(e){message('Saving failed. Storage may be full; export a backup.')}}
const cfg=data.config;
function message(s){const d=$('#notice');if(d){d.textContent=s;d.hidden=false}}
function srs(prev,ok,ms,method,quality,at=now()){
 const x={box:0,due:0,attempts:0,correct:0,streak:0,...prev};x.attempts++;if(ok)x.correct++;x.last=at;
 const valid=Number.isFinite(ms)&&ms>=0;
 const fluent=ok&&valid&&ms<=2000&&method==='direct'&&quality!=='low'&&quality!=='speech';
 const retrieved=ok&&valid&&ms<=4000&&method==='direct'&&quality!=='low'&&quality!=='speech';
 if(!ok){x.box=0;x.streak=0;x.due=at+5*60000}
 else if(fluent||retrieved){x.box=Math.min(4,x.box+1);x.streak++;x.due=at+[0,1,3,7,14][x.box]*day}
 else {x.streak=0;x.due=at+Math.max(10*60000,x.box?day/2:10*60000)}
 x.lastTier=!ok?0:fluent?3:retrieved?2:1;return x;
}
function eligible(stage){return{
 fret:stage===1?{strings:['E','A'],max:5}:stage===2?{strings:['E','A'],max:12}:stage===3?{strings:['E','A','D','G'],max:7}:{strings:['E','A','D','G'],max:12},
 keys:stage===1?['G','C','D']:stage===2?['G','C','D','A','E','F']:stage===3?['G','C','D','A','E','F','Bb','Eb']:KEYS,
 minor:stage===1?['E','A','B']:stage===2?['E','A','B','D','F#']:stage===3?['E','A','B','D','F#','C#','G']:MINKEYS,
 ivs:stage===1?INTS.filter(i=>['m3','M3','P4','P5','P8'].includes(i.n)):stage===2?INTS.filter(i=>!['TT','m7','M7'].includes(i.n)):INTS};}
function add(pool,id,skill,text,answer,kind='text',more={}){pool.push({id,skill,text,answer,kind,...more})}
function bank(stage=cfg.stage){const p=[],r=eligible(stage);
 for(const s of r.fret.strings)for(let f=0;f<=r.fret.max;f++){
  let n=noteAt(s,f),m=pc(n);add(p,`fret:loc:${s}:${f}`,'fret',`What note is on the ${s} string, fret ${f}?`,n,'note',{pc:m,explain:`${s} string, fret ${f} = ${enh(m)}.`});
  add(p,`fret:find:${s}:${f}`,'fret',`Find ${n} on the ${s} string, using frets 0–${r.fret.max}.`,`${s}:${f}`,'position',{targetPc:m,targetString:s,explain:`On the ${s} string, ${n} is at fret ${f}.`,positionScope:r.fret.max});
 }
 for(let mode of ['major','minor'])for(let root of r[mode==='major'?'keys':'minor']){
  const ns=scale(root,mode);
  for(let d=1;d<=7;d++){
   add(p,`degree:note:${mode}:${root}:${d}`,'degree',`In ${root} ${mode}, what note is degree ${d}?`,ns[d-1],'note',{pc:pc(ns[d-1]),explain:`${root} ${mode}: ${ns.join('–')}. Degree ${d} is ${ns[d-1]}.`,strictSpelling:true});
   add(p,`degree:number:${mode}:${root}:${d}`,'degree',`In ${root} ${mode}, what degree is ${ns[d-1]}?`,String(d),'number',{explain:`${ns[d-1]} is degree ${d} of ${root} ${mode}.`});
  }
  add(p,`degree:random:${mode}:${root}`,'degree',`Play the degrees 2, 1, 4, 3, 6, 5, 7, 8 in ${root} ${mode}.`,`2 1 4 3 6 5 7 8`,'sequence',{notes:[...ns,ns[0]],explain:`The notes in this order: ${[2,1,4,3,6,5,7,8].map(d=>ns[(d-1)%7]).join('–')}.`,manual:true});
 }
 for(const i of r.ivs){add(p,`interval:semitones:${i.n}`,'interval',`How many semitones in a ${i.name}?`,String(i.s),'number',{explain:`${i.name}: ${i.s} semitones.`});
  if(i.n!=='TT')for(const root of r.keys.slice(0,stage===1?3:6))add(p,`interval:above:${root}:${i.n}`,'interval',`What note is a ${i.name} above ${root}?`,spell(root,i.s,i.n==='P8'?7:parseInt(i.n.slice(-1),10)-1),'note',{explain:`Move ${i.s} semitones above ${root}; spell the interval by its letter distance.`,strictSpelling:true});
 }
 const quals=stage>=3?['major','minor','dim']:['major','minor'];
 for(const root of r.keys)for(const quality of quals){let notes=triad(root,quality);
  for(let k=0;k<3;k++)add(p,`triad:${root}:${quality}:${k}`,'triad',`What is the ${['root','third','fifth'][k]} of ${root} ${quality}?`,notes[k],'note',{strictSpelling:true,explain:`${root} ${quality}: ${notes.join('–')}.`});
  add(p,`triad:spell:${root}:${quality}`,'triad',`Spell the ${root} ${quality} triad.`,notes.join(' '),'notes',{explain:`${root} ${quality} = ${notes.join('–')}.`,strictSpelling:true});
 }
 // Audio tests: deliberately vary reference pitches and withhold tone names until answer.
 for(const i of r.ivs)for(let k=0;k<3;k++)add(p,`ear:interval:${i.n}:${k}`,'ear',`Listen: identify the ascending interval.`,i.n,'interval',{interval:i.s,explain:`${i.name} is ${i.s} semitones.`,audio:true});
 for(let s of [1,2,3,4,5,6])for(let k=0;k<3;k++)add(p,`ear:direction:${s}:${k}`,'ear',`Listen to the two notes. Is the second higher or lower?`,k%2?'Lower':'Higher','choice',{choices:['Higher','Lower'],audio:true,interval:s*(k%2?-1:1),explain:'Compare the second pitch with the first.'});

  let ns=scale(root,'major'),target=ns[degree-1];add(p,`ear:sing:${root}:${degree}`,'ear',`Listen to the tonic, then sing degree ${degree} of ${root} major.`,target,'sing',{root,degree,targetPc:pc(target),audio:true,manual:true,explain:`Degree ${degree} is ${target}. First pitch accuracy and final matching are recorded separately.`});
 }
 const staffLetters=['G','A','B','C','D','E','F','G','A','B','C','D','E','F','G','A'];
 staffLetters.forEach((n,i)=>add(p,`notation:staff:${i}`,'notation',`Name this bass-clef note.`,n,'note',{pc:pc(n),staff:i,explain:`Bass clef note: ${n}.` }));
 add(p,'rhythm:tap:44','rhythm','Tap eight eighth notes in 4/4 after a one-bar count-in.','8 taps','tap',{meter:'4/4',tapsNeeded:8,manual:true,explain:'Eight even eighth notes in one 4/4 bar. Device tap timing is approximate.'});
 add(p,'rhythm:tap:68','rhythm','Tap six eighth notes in 6/8, grouped 3 + 3, after a one-bar count-in.','6 taps','tap',{meter:'6/8',tapsNeeded:6,manual:true,explain:'Six eighth notes in compound 6/8 grouped in two groups of three. Device tap timing is approximate.'});
 for(let b of ['1 & 2 & 3 & 4 &','1 e & a 2 e & a','1 la li 2 la li'])add(p,`rhythm:sub:${b}`,'rhythm',`Count this subdivision aloud while keeping the pulse.`,b,'rhythm',{manual:true,explain:`Count ${b} while keeping the main beats steady.`});

const concepts=[
 ['Major scale pattern','W W H W W W H','The seven intervals of the major scale.'],
 ['Natural minor pattern','W H W W H W W','The seven intervals of natural minor.'],
 ['What does one fret mean?','One semitone','Two frets are one whole step.'],
 ['Bass open strings','E A D G','Lowest to highest. Adjacent strings differ by a perfect fourth.'],
 ['Perfect fourth versus perfect fifth','P4 = 5 semitones; P5 = 7 semitones','Interval numbers count letter names; semitones measure pitch distance.'],
 ['Major triad','1 3 5','Root, major third, perfect fifth.'],
 ['Minor triad','1 ♭3 5','Root, minor third, perfect fifth.'],
 ['Diminished triad','1 ♭3 ♭5','Root, minor third, diminished fifth.'],
 ['Diatonic major-key triad qualities','I ii iii IV V vi vii°','Major, minor, minor, major, major, minor, diminished.'],
 ['Bass-clef lines, bottom to top','G B D F A','Bass clef line-note names.'],
 ['Bass-clef spaces, bottom to top','A C E G','Bass clef space-note names.'],
 ['6/8 compound feel','Two main dotted-quarter beats; three eighths each','Six eighth notes per measure, grouped 3 + 3.'],
 ['Major third','4 semitones','Minor third is 3 semitones.'],
 ['Relative minor of a major key','Degree 6','For example C major → A minor.'],
 ['Chord versus key','The current chord can differ from the tonal center','A song in G can contain C, D, and Em chords.']
];
function cardBank(){return concepts.map((x,i)=>({id:`concept:${i}`,front:x[0],back:x[1],explain:x[2]}));}
function staffSVG(idx){const y=98-idx*6;let lines='',ledger='';for(let i=0;i<5;i++)lines+=`<line x1="15" y1="${50+i*12}" x2="300" y2="${50+i*12}" stroke="currentColor" stroke-width="1.7"/>`;for(let l=110;l<=y;l+=12)ledger+=`<line x1="164" x2="216" y1="${l}" y2="${l}" stroke="currentColor"/>`;for(let l=38;l>=y;l-=12)ledger+=`<line x1="164" x2="216" y1="${l}" y2="${l}" stroke="currentColor"/>`;return `<svg viewBox="0 0 315 132" aria-label="Bass clef staff with a note"><text x="25" y="94" fill="currentColor" font-size="67" font-family="serif">𝄢</text>${lines}${ledger}<ellipse cx="190" cy="${y}" rx="9" ry="6" transform="rotate(-18 190 ${y})" fill="currentColor"/><line x1="198" y1="${y}" x2="198" y2="${y-34}" stroke="currentColor" stroke-width="2"/></svg>`}
let activeTab='train',session=null,question=null,answerAt=null,stopAt=null,answerGiven=false,lastId='',cardCurrent=null,cardShownAt=0,cardFlipped=false;
function view(tab){activeTab=tab;$$('.tab').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===tab)));for(const id of ['train','cards','progress','setup'])$('#'+id).hidden=id!==tab;render()}
$$('.tab').forEach(el=>el.onclick=()=>view(el.dataset.tab));
function render(){if(activeTab==='train')renderTrain();if(activeTab==='cards')renderCards();if(activeTab==='progress')renderProgress();if(activeTab==='setup')renderSetup();updatePrivacy()}
function updatePrivacy(){$('#privacy').textContent=(mic.stream?'Mic on':'Mic off')+' · local progress'}
function tier(st){return st?.lastTier??0}
function skillMetrics(skill,assessmentOnly=false){const arr=data.log.filter(x=>x.skill===skill&&(!assessmentOnly||x.assessment)).slice(-60);const timed=arr.filter(x=>Number.isFinite(x.ms)&&x.ok);return{n:arr.length,acc:arr.length?arr.filter(x=>x.ok).length/arr.length:null,median:med(timed.map(x=>x.ms)),fluent:arr.filter(x=>x.tier===3).length}}
function unlockedStage(){let metrics=['fret','degree','interval','triad'].map(s=>skillMetrics(s,true));let ok=metrics.every(m=>m.n>=10&&m.acc>=.9&&(m.median??Infinity)<=3500);return ok?Math.min(4,cfg.stage+1):cfg.stage}
function picker(pool,assessment=false){let c=pool.filter(x=>x.id!==lastId);if(!c.length)c=pool;

 let due=c.filter(x=>data.items[x.id]&&data.items[x.id].due<=now());if(due.length)return rand(due.sort((a,b)=>(data.items[a.id].box-data.items[b.id].box)).slice(0,8));let newItems=c.filter(x=>!data.items[x.id]);if(newItems.length)return rand(newItems);return rand(c.sort((a,b)=>data.items[a.id].due-data.items[b.id].due).slice(0,12));}

      const err=e*100+cent,exactErr=q._targetMidi==null?null:(m-q._targetMidi)*100;
      let st=mic.pitchStats||{firstCents:err,bestCents:err,firstExactCents:exactErr,bestExactCents:exactErr,secondsToMatch:null,secondsToExactMatch:null,frames:0,started:now(),exactMidi:nearest};
      st.frames++;
      if(Math.abs(err)<Math.abs(st.bestCents))st.bestCents=err;
      if(exactErr!=null&&Math.abs(exactErr)<Math.abs(st.bestExactCents))st.bestExactCents=exactErr;
      if(st.secondsToExactMatch==null&&exactErr!=null&&Math.abs(exactErr)<=50)st.secondsToExactMatch=(now()-st.started)/1000;
      if(st.secondsToMatch==null&&Math.abs(err)<=50)st.secondsToMatch=(now()-st.started)/1000;
      st.lastCents=err;st.lastExactCents=exactErr;mic.pitchStats=st;showPitchStats();
     }
     messageToMic(`Detected ${SH[mod(nearest)]}${Math.floor(nearest/12)-1} · ${cent>=0?'+':''}${cent.toFixed(0)} cents · clarity ${(y.clarity*100).toFixed(0)}%. Physical string/fret is NOT verified.`);
    }
   }
  }
  mic.raf=requestAnimationFrame(frame);
 };
 frame();
}
function showPitchStats(){if(!mic.pitchStats)return;let p=mic.pitchStats,el=$('#pitchStats'),mark=$('#pitchMark');if(el)el.textContent=`Pitch-class: initial ${Math.round(p.firstCents)}¢, best ${Math.round(p.bestCents)}¢. Exact register: initial ${Math.round(p.firstExactCents)}¢, best ${Math.round(p.bestExactCents)}¢, time to match ${p.secondsToExactMatch==null?'not yet':p.secondsToExactMatch.toFixed(1)+'s'}. Advisory measurements.`;if(mark)mark.style.left=(50+Math.max(-50,Math.min(50,p.lastCents))/2)+'%'}
/* Flashcards deliberately DO NOT accelerate SRS without a timed direct answer. */
function renderCards(){let v=$('#cards'),p=cardBank();if(!cardCurrent){cardCurrent=rand(p);cardShownAt=performance.now()}let x=cardCurrent,s=data.cards[x.id]||{};v.innerHTML=`<div class="card"><div class="row"><h2>Concept cards</h2><span class="chip">${p.length} concepts</span></div><p class="small">Reveal the answer, then rate recall. Self-rating alone never earns an automatic-fluency tier.</p><button class="btn full" id="flip" style="min-height:170px;display:grid;align-content:center;gap:7px"><strong style="font-size:22px">${esc(cardFlipped?x.back:x.front)}</strong><span class="small">${cardFlipped?esc(x.explain):'Tap to reveal'}</span></button>${cardFlipped?`<div class="grid2"><button class="btn" id="missCard">Not recalled</button><button class="btn primary" id="gotCard">Recalled</button></div><div class="small">Time to reveal: ${((stopAt??performance.now())-cardShownAt>=0?((stopAt??performance.now())-cardShownAt)/1000:0).toFixed(1)}s (excludes button delay). Review alone cannot advance Tier 3.</div>`:''}<div class="small">Previous attempts: ${s.attempts||0} · Next review: ${s.due?new Date(s.due).toLocaleDateString():'new'}</div></div>`;
 $('#flip').onclick=()=>{if(!cardFlipped){stopAt=performance.now();cardFlipped=true;renderCards()}else{cardFlipped=false;newCard()}};
 if(cardFlipped){$('#missCard').onclick=()=>rateCard(false);$('#gotCard').onclick=()=>rateCard(true)}
}
function newCard(){let pool=cardBank(),due=pool.filter(x=>data.cards[x.id]&&data.cards[x.id].due<=now()&&x.id!==cardCurrent?.id),fresh=pool.filter(x=>!data.cards[x.id]&&x.id!==cardCurrent?.id);cardCurrent=rand(due.length?due:fresh.length?fresh:pool.filter(x=>x.id!==cardCurrent?.id));cardFlipped=false;cardShownAt=performance.now();stopAt=null;renderCards()}
function rateCard(correct){let ms=stopAt-cardShownAt;let s={box:0,attempts:0,correct:0,...(data.cards[cardCurrent.id]||{})};s.attempts++;if(correct)s.correct++;s.box=correct?Math.min(4,s.box+1):0;s.due=now()+(correct?[0,1,3,7,14][s.box]*day:5*60000);s.lastTier=correct?1:0;data.cards[cardCurrent.id]=s;data.log.push({t:now(),id:cardCurrent.id,skill:'concept',ok:correct,ms,method:'self',tier:correct?1:0,source:'card',assessment:false});save();newCard()}
function renderProgress(){let v=$('#progress');const skills=Object.keys(SKILL);let rows=skills.map(s=>{let m=skillMetrics(s),am=skillMetrics(s,true);return `<tr><td><strong>${SKILL[s]}</strong></td><td>${m.acc==null?'—':Math.round(m.acc*100)+'%'}</td><td>${m.median==null?'—':(m.median/1000).toFixed(1)+'s'}</td><td>${m.fluent}/${m.n}</td><td>${am.n?Math.round(am.acc*100)+'%':'—'}</td></tr>`}).join('');let due=Object.values(data.items).filter(s=>s.due<=now()).length,achieved=Object.values(data.items).filter(s=>s.box===4).length;v.innerHTML=`<div class="card"><h2>Progress dashboard</h2><div class="grid3"><div class="stat"><strong>${data.log.length}</strong><span class="small">Total attempts</span></div><div class="stat"><strong>${due}</strong><span class="small">Due reviews</span></div><div class="stat"><strong>${achieved}</strong><span class="small">14-day box</span></div></div><div class="scroll"><table><thead><tr><th>Skill</th><th>Accuracy</th><th>Median</th><th>Fluent / N</th><th>Assess.</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small">Scores represent the most recent 60 recorded attempts per skill. Fast correct guesses, counted answers, and self-assessments are not automatic retrieval. These metrics are not a substitute for playing assessments.</p></div><div class="card"><h2>Mastery gates</h2><p>Advance to the next stage after consistent 90% accuracy, median recall within 3.5 seconds in independent assessments, and several days of retained performance. Self-checks and microphone-only note matches cannot certify position mastery.</p><p class="small">Current stage: ${cfg.stage}. ${unlockedStage()>cfg.stage?'An initial assessment threshold is available; confirm retention before advancing.':'Continue current work and independent tests.'}</p></div><div class="card"><h2>Recent mistakes and reconstructions</h2>${data.log.filter(x=>!x.ok||!['direct'].includes(x.method)).slice(-12).reverse().map(x=>`<div class="small"><span class="mono">${new Date(x.t).toLocaleDateString()}</span> · ${esc(SKILL[x.skill]||x.skill)} · ${esc(x.id)} · ${x.ok?'correct with '+(x.method||'other'):'missed'}</div>`).join('')||'<p class="small">None recorded yet.</p>'}</div>`;}
function renderSetup(){const v=$('#setup');v.innerHTML=`<div id="notice" class="callout" hidden></div><div class="card"><h2>Training setup</h2><div class="grid2"><label class="field">Minutes per session<select id="minutes">${[15,30,45,55,60,90].map(v=>`<option ${cfg.minutes===v?'selected':''} value="${v}">${v}</option>`).join('')}</select></label><label class="field">Curriculum stage<select id="stage">${[1,2,3,4].map(v=>`<option value="${v}" ${cfg.stage===v?'selected':''}>Stage ${v}</option>`).join('')}</select></label><label class="field">Click tempo (BPM)<input id="bpm" type="number" min="40" max="200" value="${cfg.bpm}"></label><label class="field">Microphone sensitivity<input id="sensitivity" type="number" step="0.001" min="0.002" max="0.05" value="${cfg.sensitivity}"></label></div><p class="small">Changing the stage changes question difficulty, not stored scores. Progression is based on demonstrated mastery; stages 1–4 are real pools (no unbuilt Weeks 6–12).</p><button class="btn primary" id="saveSettings">Save settings</button></div><div class="card"><h2>Privacy and audio</h2><p>Audio synthesis runs inside the browser. Microphone analysis uses Web Audio locally and is opt-in for each question; no audio is recorded to a server by this file. No external JavaScript, fonts, analytics, or tracking libraries are loaded. If you opt into browser speech-to-text, the browser may involve an external provider.</p><p class="small">Optional browser speech-to-text can be used after an explicit privacy warning, and its transcript must be confirmed before scoring. It may contact a platform service and can confuse note names. Typing and tapping require no speech service. Microphone pitch estimates are advisory, not proof of fret position.</p><button class="btn" id="stopMic">Stop microphone / click track</button></div><div class="card"><h2>Backup and migration</h2><p class="small">This app stores v2 results in browser local storage. If old v1 data is present, it stays intact under <span class="mono">bassTrainer.v1</span> and is included in exported backups. Old scores are not merged into the v2 mastery system because scoring differs.</p><div class="grid2"><button class="btn primary" id="exportData">Export JSON backup</button><label class="btn" style="text-align:center">Import JSON<input type="file" id="importData" accept=".json,application/json" hidden></label></div><button class="btn danger" id="clearData">Reset v2 progress only</button>${data.legacy?'<p class="small good">Legacy v1 backup detected and preserved.</p>':'<p class="small">No legacy v1 backup detected.</p>'}</div>`;
 $('#saveSettings').onclick=()=>{cfg.minutes=+$('#minutes').value;cfg.stage=+$('#stage').value;cfg.bpm=Math.max(40,Math.min(200,+$('#bpm').value||75));cfg.sensitivity=Math.max(.002,Math.min(.05,+$('#sensitivity').value||.008));save();message('Settings saved.');};
 $('#stopMic').onclick=()=>{closeMic();message('Microphone and click track stopped.')};
 $('#exportData').onclick=()=>{let backup={...data,originalV1:(()=>{try{return JSON.parse(localStorage.getItem(OLD))}catch(e){return null}})()};let blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bass-trainer-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
 $('#importData').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;try{let x=safetyJson(await file.text());if(x.version!==2||!x.config||!x.items||!x.cards||!Array.isArray(x.log))throw Error('Not a v2 trainer backup');if(!confirm('Replace your current v2 progress with this backup? Export first if you want to keep it.'))return;data={...x,config:{...DEF,...x.config}};if(x.originalV1&&!localStorage.getItem(OLD))localStorage.setItem(OLD,JSON.stringify(x.originalV1));save();location.reload()}catch(e){message('Import failed: '+e.message)}};
 $('#clearData').onclick=()=>{if(!confirm('Delete ONLY v2 scores and review items? Your v1 backup will be kept.'))return;data.items={};data.cards={};data.log=[];save();renderSetup()};}
// Start after document parsed. Readable questions are the default; no automatic microphone access.
render();
</script>
